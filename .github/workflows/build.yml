name: Build WDA for iOS 18 (merged xctest)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout WebDriverAgent
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: master
          submodules: true

      - name: Setup Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Build WDA
        continue-on-error: true
        run: |
          mkdir -p /tmp/wda-artifacts
          xcodebuild -project WebDriverAgent.xcodeproj -scheme WebDriverAgentRunner -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CONFIGURATION_BUILD_DIR="$PWD/build" > /tmp/wda-artifacts/build.log 2>&1
          EXIT=$?
          echo "xcodebuild exit=$EXIT"
          if [ $EXIT -ne 0 ]; then
            cp /tmp/wda-artifacts/build.log /tmp/wda-artifacts/build.log
            echo "BUILD_FAILED"
          fi
          echo "=== apps found ==="
          find build -name "*.app" -maxdepth 4 -type d || true
          echo "=== build dir ==="
          ls -la build/ 2>/dev/null | head -10 || true

      - name: Package IPA
        if: success()
        run: |
          APP=$(find build -name "*.app" -maxdepth 4 -type d | head -1)
          if [ -z "$APP" ]; then echo "NO APP BUILD"; exit 1; fi
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qr WebDriverAgent-iOS18.ipa Payload/
          ls -lh WebDriverAgent-iOS18.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WDA-iOS18-v2
          path: WebDriverAgent-iOS18.ipa
          retention-days: 30

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/wda-artifacts/
          retention-days: 7
          if-no-files-found: ignore

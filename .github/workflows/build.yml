name: Build WDA for iOS 16 (Xcode 15 + entitlements)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout WDA v8.7.12
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: v8.7.12
          submodules: true

      - name: Bootstrap
        run: |
          if [ -f "./Scripts/bootstrap.sh" ]; then
            bash ./Scripts/bootstrap.sh -d || true
          else
            echo "no bootstrap.sh"
          fi
          ls -la || true

      - name: Build WDA
        run: |
          xcodebuild -project WebDriverAgent.xcodeproj -scheme WebDriverAgentRunner -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CONFIGURATION_BUILD_DIR="$PWD/build" > /tmp/build.log 2>&1
          EXIT=$?
          echo "xcodebuild exit=$EXIT"
          [ $EXIT -eq 0 ] || (tail -60 /tmp/build.log; exit $EXIT)
          find build -name "*.app" -maxdepth 4 -type d

      - name: Inject entitlements
        run: |
          APP=$(find build -name "*.app" -maxdepth 4 -type d | head -1)
          if [ -z "$APP" ]; then echo "NO APP"; exit 1; fi
          cat > /tmp/ent.plist << 'PLIST'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>com.apple.security.exception.mach-lookup.global-name</key>
  <array>
    <string>com.apple.testmanagerd</string>
    <string>com.apple.assertiond</string>
  </array>
  <key>com.apple.security.exception.iosurface.io-client</key>
  <array/>
  <key>com.apple.security.exception.iokit-user-client-class</key>
  <array/>
  <key>com.apple.private.xpc.launchd.privileged-sanitized</key>
  <true/>
  <key>get-task-allow</key>
  <true/>
</dict>
</plist>
PLIST
          cat /tmp/ent.plist
          BIN="$APP/WebDriverAgentRunner-Runner"
          echo "signing main binary with entitlements..."
          codesign --force --sign - --entitlements /tmp/ent.plist --timestamp=none "$BIN"
          echo "verify:"
          codesign -d --entitlements - "$BIN" 2>&1 | head -25
          echo "=== done ==="

      - name: Package IPA
        run: |
          APP=$(find build -name "*.app" -maxdepth 4 -type d | head -1)
          if [ -z "$APP" ]; then echo "NO APP BUILD"; exit 1; fi
          rm -rf "$APP/PlugIns/WebDriverAgentRunner.xctest.dSYM"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qr WebDriverAgent-iOS18.ipa Payload/
          ls -lh WebDriverAgent-iOS18.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: WDA-iOS18-v2
          path: WebDriverAgent-iOS18.ipa
          retention-days: 30

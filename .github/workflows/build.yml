name: Build WDA for iOS 18 (merged xctest)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout WebDriverAgent
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: master
          submodules: true

      - name: Setup Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Bootstrap deps
        run: |
          if [ -f "./Scripts/bootstrap.sh" ]; then
            echo "running bootstrap.sh"
            bash ./Scripts/bootstrap.sh -d || true
          else
            echo "no bootstrap.sh"
          fi
          if command -v carthage >/dev/null 2>&1; then
            echo "running carthage bootstrap"
            carthage bootstrap --platform iOS 2>&1 | tail -15 || true
          else
            echo "no carthage"
          fi
          ls -la Carthage/Build 2>/dev/null || echo "no carthage build dir"
          ls -la WebDriverAgentRunner/ 2>/dev/null | head -5

      - name: Build WDA
        run: |
          xcodebuild -project WebDriverAgent.xcodeproj -scheme WebDriverAgentRunner -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CONFIGURATION_BUILD_DIR="$PWD/build" > /tmp/build.log 2>&1
          EXIT=$?
          if [ $EXIT -ne 0 ]; then
            tail -50 /tmp/build.log | while IFS= read -r line; do echo "::error::$line"; done
            exit $EXIT
          fi
          echo "=== apps found ==="
          find build -name "*.app" -maxdepth 4 -type d

      - name: Package IPA
        run: |
          APP=$(find build -name "*.app" -maxdepth 4 -type d | head -1)
          if [ -z "$APP" ]; then echo "NO APP BUILD"; exit 1; fi
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qr WebDriverAgent-iOS18.ipa Payload/
          ls -lh WebDriverAgent-iOS18.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: WDA-iOS18-v2
          path: WebDriverAgent-iOS18.ipa
          retention-days: 30

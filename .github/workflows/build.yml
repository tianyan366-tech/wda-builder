name: Build WDA for iOS 18 (merged xctest)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout WebDriverAgent
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: master
          submodules: true

      - name: Setup Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Strip Assets (actool simulator bug)
        run: |
          sed -i '' '/Assets.xcassets/d' WebDriverAgent.xcodeproj/project.pbxproj || true
          rm -rf WebDriverAgentRunner/Assets.xcassets
          rm -rf WebDriverAgentLib/Assets.xcassets 2>/dev/null || true
          echo "assets stripped"

      - name: Build WDA (no chained fixups)
        run: |
          xcodebuild -project WebDriverAgent.xcodeproj -scheme WebDriverAgentRunner -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=NO OTHER_LDFLAGS="-Wl,-no_fixup_chains" CONFIGURATION_BUILD_DIR="$PWD/build" > /tmp/build.log 2>&1
          EXIT=$?
          echo "xcodebuild exit=$EXIT"
          [ $EXIT -eq 0 ] || (tail -50 /tmp/build.log; exit $EXIT)
          find build -name "*.app" -maxdepth 4 -type d

      - name: Strip Apple frameworks (ldid Unsupported Mach-O fix)
        run: |
          APP=$(find build -name "*.app" -maxdepth 4 -type d | head -1)
          echo "stripping from: $APP"
          rm -rf "$APP/Frameworks/XCTest.framework"
          rm -rf "$APP/Frameworks/XCTestCore.framework"
          rm -rf "$APP/Frameworks/Testing.framework"
          rm -rf "$APP/Frameworks/XCTAutomationSupport.framework"
          rm -rf "$APP/Frameworks/XCUIAutomation.framework"
          rm -rf "$APP/Frameworks/XCUnit.framework"
          rm -rf "$APP/Frameworks/XCTestSupport.framework"
          rm -rf "$APP/Frameworks/libXCTestSwiftSupport.dylib"
          rm -rf "$APP/PlugIns/WebDriverAgentRunner.xctest.dSYM"
          echo "=== remaining Frameworks ==="
          ls -la "$APP/Frameworks/" 2>/dev/null || echo "(no Frameworks dir)"
          echo "=== app size ==="
          du -sh "$APP"

      - name: Package IPA
        run: |
          APP=$(find build -name "*.app" -maxdepth 4 -type d | head -1)
          if [ -z "$APP" ]; then echo "NO APP BUILD"; exit 1; fi
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qr WebDriverAgent-iOS18.ipa Payload/
          ls -lh WebDriverAgent-iOS18.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: WDA-iOS18-v2
          path: WebDriverAgent-iOS18.ipa
          retention-days: 30
